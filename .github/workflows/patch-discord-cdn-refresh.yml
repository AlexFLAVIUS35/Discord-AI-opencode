name: Patch Discord CDN refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Discord CDN URL refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/sessionManager.ts')
          s = p.read_text()
          if 'async function refreshDiscordAttachmentUrl' in s:
              print('Discord CDN refresh patch already present')
              raise SystemExit(0)

          marker = 'async function resolveLinkedMedia(url: string): Promise<{ url: string; mime: string } | null> {'
          helper = r'''function isDiscordAttachmentUrl(value: string): boolean {
            try {
              const url = new URL(value);
              return (url.hostname.toLowerCase() === 'cdn.discordapp.com' || url.hostname.toLowerCase() === 'media.discordapp.net') && /^\\/attachments\\//i.test(url.pathname);
            } catch { return false; }
          }

          async function refreshDiscordAttachmentUrl(url: string): Promise<string | null> {
            if (!isDiscordAttachmentUrl(url)) return null;
            const token = process.env.DISCORD_BOT_TOKEN ?? process.env.DISCORD_TOKEN;
            if (!token) {
              console.error('[Media] Discord CDN refresh skipped: no DISCORD_BOT_TOKEN/DISCORD_TOKEN');
              return null;
            }
            try {
              const response = await fetch('https://discord.com/api/v10/attachments/refresh-urls', {
                method: 'POST',
                headers: {
                  Authorization: `Bot ${token}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'Leeha/1.0 (+https://github.com/AlexFLAVIUS35/Discord-AI-opencode)',
                },
                body: JSON.stringify({ attachment_urls: [url] }),
                signal: AbortSignal.timeout(7000),
              });
              if (!response.ok) {
                console.error(`[Media] Discord CDN refresh failed: ${response.status} ${response.statusText}`);
                return null;
              }
              const data = await response.json() as { refreshed_urls?: Array<{ original?: string; refreshed?: string }> };
              const refreshed = data.refreshed_urls?.find(item => item.original === url)?.refreshed ?? data.refreshed_urls?.[0]?.refreshed;
              if (!refreshed) {
                console.error('[Media] Discord CDN refresh returned no refreshed URL');
                return null;
              }
              return refreshed;
            } catch (error) {
              console.error('[Media] Discord CDN refresh error:', error instanceof Error ? error.message : error);
              return null;
            }
          }

          '''
          if marker not in s:
              raise SystemExit('resolveLinkedMedia marker not found')
          s = s.replace(marker, helper + marker, 1)

          old = '''  const response = await fetchExternal(url);
  if (!response || !response.ok) {
    console.error(`[Media] Failed to fetch linked media: ${url} (${response?.status ?? 'network error'})`);
    return null;
  }
  const responseMime = response.headers.get('content-type')?.split(';')[0].toLowerCase();
  if (isDiscordGifUrl(url) && responseMime === 'image/gif') {'''
          new = '''  const refreshedDiscordUrl = await refreshDiscordAttachmentUrl(url);
  const fetchUrl = refreshedDiscordUrl ?? url;
  const response = await fetchExternal(fetchUrl);
  if (!response || !response.ok) {
    console.error(`[Media] Failed to fetch linked media: ${url} (${response?.status ?? 'network error'})`);
    return null;
  }
  const responseMime = response.headers.get('content-type')?.split(';')[0].toLowerCase();
  if (isDiscordGifUrl(fetchUrl) && responseMime === 'image/gif') {'''
          if old not in s:
              raise SystemExit('resolveLinkedMedia fetch block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          print('Patched Discord CDN URL refresh')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/sessionManager.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: refresh Discord CDN URLs before fetch'
          git push
